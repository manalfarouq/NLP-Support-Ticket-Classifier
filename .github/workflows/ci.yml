name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:

  # ==========================================
  # JOB 1 : LINT (vérification du code)
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Installer flake8
        run: pip install flake8

      - name: Lancer le lint
        run: |
          flake8 src/ config/ \
            --max-line-length=120 \
            --ignore=E501,W503

  # ==========================================
  # JOB 2 : BUILD DOCKER
  # ==========================================
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: lint  # S'exécute seulement si le lint réussit

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Construire l'image Docker
        run: docker build -t nlp-classifier:latest .

      - name: Vérifier que l'image existe
        run: docker images | grep nlp-classifier
