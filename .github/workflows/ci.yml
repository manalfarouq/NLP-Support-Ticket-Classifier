name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Installer flake8
        run: pip install flake8

      - name: Lancer le lint
        run: |
          flake8 src/ config/ \
            --max-line-length=120 \
            --ignore=E501,W503,W293,W292,E302,E305,E402,E226,E241,E231,E221,E704,F401

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Construire l'image Docker
        run: docker build -t nlp-classifier:latest .

      - name: Vérifier que l'image existe
        run: docker images | grep nlp-classifierapiVersion: batch/v1
kind: Job
metadata:
  name: nlp-pipeline-job
  labels:
    app: nlp-classifier
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: nlp-pipeline
          image: nlp-classifier:latest
          imagePullPolicy: Never
          command: ["python", "-m", "src.main"]
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          # Pas de volumeMounts — les données sont dans l'image
  backoffLimit: 0